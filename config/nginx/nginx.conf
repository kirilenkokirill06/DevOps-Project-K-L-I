worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Set up custom log format showing real client IP derived from proxy protocol
    log_format main_proxy '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'Real_Client_IP: $realip_remote_addr Hostname: $hostname';

    access_log /var/log/nginx/access.log main_proxy;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Configure temporary directories to use /tmp since rootfs is read-only
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Main application server block (Accessible only via HAProxy with proxy_protocol)
    server {
        listen 8080 proxy_protocol;
        server_name _;

        # Extract real client IP from HAProxy proxy_protocol header
        real_ip_header proxy_protocol;
        
        # Trust HAProxy IPs in the Docker bridge network space (172.16.0.0/12)
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from 10.0.0.0/8;

        # Serve details about the server to demonstrate load balancing
        location / {
            default_type text/html;
            add_header Content-Type "text/html; charset=utf-8";
            return 200 '
            <!DOCTYPE html>
            <html>
            <head>
                <title>Nginx Backend Node</title>
                <style>
                    body { font-family: "Outfit", sans-serif; background: #0f172a; color: #f8fafc; padding: 50px; text-align: center; }
                    .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-radius: 12px; padding: 30px; display: inline-block; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); border: 1px solid rgba(255, 255, 255, 0.1); }
                    h1 { color: #38bdf8; }
                    .highlight { font-weight: bold; color: #fb7185; }
                </style>
            </head>
            <body>
                <div class="card">
                    <h1>Узел бэкенда Nginx</h1>
                    <p>Ответ получен от сервера: <span class="highlight">$hostname</span></p>
                    <p>Реальный IP клиента (из Proxy Protocol): <span class="highlight">$realip_remote_addr</span></p>
                    <p>Заголовок X-Forwarded-For: <span class="highlight">$http_x_forwarded_for</span></p>
                </div>
            </body>
            </html>
            ';
        }

        # Expose HAProxy check URL on main port (secured by proxy_protocol)
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "OK";
        }
    }

    # Health check server block (Without proxy_protocol)
    # This port is used by Docker Healthcheck locally within the container.
    server {
        listen 8081;
        server_name localhost;

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "OK";
        }
    }
}
