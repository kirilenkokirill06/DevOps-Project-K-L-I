# ==============================================================================
# LINUX KERNEL HARDENING PARAMETERS (99-hardening.conf)
# Place in /etc/sysctl.d/99-hardening.conf and reload with `sysctl --system`
# ==============================================================================

# 1. Network Stack Security (Prevents SYN Flood attacks)
# Enable TCP SYN cookies to protect against TCP SYN flood attacks
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_syn_retries = 5
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_max_syn_backlog = 4096

# 2. Source Routing & IP Spoofing Prevention
# Do not accept IP source route packets (we are not a router)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Turn on reverse path filtering (prevents IP spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# 3. ICMP Redirects Protection (Prevents Man-In-The-Middle / MITM redirects)
# Do not accept ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Do not send ICMP redirects (we are a load balancer node, not a gateway)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# 4. ICMP Broadcast & Error Response Hardening
# Ignore ICMP echo requests sent to broadcast addresses
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# 5. Logging and Martians
# Log packets with impossible addresses (Martian packets)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# 6. IPv6 Hardening (Disabled if not actively used)
# Disable IPv6 to reduce the attack surface if only IPv4 is required
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1

# 7. System Limits & Stability
# Increase maximum number of open files globally
fs.file-max = 2097152

# Do not use swap space unless absolutely necessary (keeps memory allocations in RAM)
vm.swappiness = 10
