global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    retries 3
    option redispatch
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

# Main HTTP Traffic Frontend
frontend http_front
    bind *:8080
    # Enable X-Forwarded-For header addition
    option forwardfor
    # Add unique request ID for tracing
    http-request add-header X-Request-ID %[uuid]
    default_backend nginx_back

# Management & Observability Frontend
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    # Authenticate statistics page with Docker Secrets via Environment variables
    stats auth "${STATS_USER}":"${STATS_PASSWORD}"
    
    # Health check for HAProxy itself
    monitor-uri /health
    
    # Expose Prometheus Metrics endpoint
    http-request use-service prometheus-exporter if { path /metrics }

# Nginx Backends Pool
backend nginx_back
    balance roundrobin
    
    # Sticky Sessions: Client gets a cookie containing the backend ID (web1, web2, web3)
    # indirect: hides cookie from backend; nocache: does not allow caching of proxy cookie
    cookie SERVERID insert indirect nocache
    
    # Advanced health check endpoint
    option httpchk GET /health
    
    # Backends communicating via PROXY protocol to retain client IP
    # Inter: check interval, fall: down after X failures, rise: up after Y successes
    server web1 nginx1:8080 cookie web1 check inter 2s fall 3 rise 2 send-proxy
    server web2 nginx2:8080 cookie web2 check inter 2s fall 3 rise 2 send-proxy
    server web3 nginx3:8080 cookie web3 check inter 2s fall 3 rise 2 send-proxy
